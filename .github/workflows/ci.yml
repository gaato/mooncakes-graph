name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Pinned toolchain: bump together with moonbit-version and pages.yml.
      image: ghcr.io/gaato/moonbit:0.10.16
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trust the workspace (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The gates compare the CLI with a Python reader and with tree(1).
      - name: Install python3 and tree
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends python3 tree

      - name: Fetch the registry index
        run: |
          moon version --all
          moon update

      - name: Gates
        run: ./scripts/gates.sh
